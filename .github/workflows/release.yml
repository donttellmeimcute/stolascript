name: Release Compilers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Linux build  →  stolascript-linux-x86_64.tar.gz
  # ─────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build compiler + runtime library
        run: make

      - name: Test
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          make test

      - name: Build StolaOS image
        run: make os

      - name: Package release archive
        run: |
          D=dist/stolascript-linux-x86_64
          mkdir -p $D/src $D/lib
          strip s
          cp s README.md $D/
          cp lib/libstola.a $D/lib/
          cp src/runtime.c src/runtime.h src/builtins.c $D/src/
          cp -r stdlib os bench $D/
          cp os/stolaos.bin $D/os/
          cd dist
          tar -czf stolascript-linux-x86_64.tar.gz stolascript-linux-x86_64/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/stolascript-linux-x86_64.tar.gz

  # ─────────────────────────────────────────────────────────────────────────
  # Windows build  →  stolascript-windows-x86_64.zip
  # ─────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build (Windows x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add LLVM/clang to PATH
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (Test-Path $llvm) {
            echo "$llvm" >> $env:GITHUB_PATH
          }

      - name: Build compiler
        run: |
          clang -O2 -DNDEBUG -std=c11 `
            src/main.c src/lexer.c src/parser.c src/ast.c `
            src/semantic.c src/codegen.c src/builtin_table.c `
            -o s.exe

      - name: Smoke test
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          .\s.exe run tests\hosted\01_basics.stola > out.txt
          if (Compare-Object (Get-Content out.txt) (Get-Content tests\hosted\01_basics.out)) { exit 1 }

      - name: Package release archive
        shell: pwsh
        run: |
          $D = "dist\stolascript-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$D\src" | Out-Null
          Copy-Item s.exe, README.md $D\
          Copy-Item src\runtime.c, src\runtime.h, src\builtins.c "$D\src\"
          Copy-Item -Recurse stdlib, os, bench $D\
          Compress-Archive -Path $D -DestinationPath dist\stolascript-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist\stolascript-windows-x86_64.zip

  # ─────────────────────────────────────────────────────────────────────────
  # Create GitHub Release and attach both archives
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: artifacts/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "StolasScript ${{ github.ref_name }}"
          body: |
            ## StolasScript ${{ github.ref_name }}

            ### Requisitos

            | Objetivo (`--target`) | Necesitas |
            |---|---|
            | `hosted` (por defecto) | `gcc` o `clang` (solo para ensamblar y enlazar el runtime) |
            | `linux` (sin libc) | `as` y `ld` (binutils) — **cero C** |
            | `kernel` (StolaOS) | `as`, `ld`, `objcopy`; `qemu-system-x86_64` para arrancarlo |

            ### Uso rápido

            ```bash
            tar -xzf stolascript-linux-x86_64.tar.gz && cd stolascript-linux-x86_64
            ./s run programa.stola                       # compila y ejecuta
            ./s build programa.stola -o programa         # ejecutable nativo
            ./s build prog.stola --target linux -o prog  # binario estático sin libc
            qemu-system-x86_64 -kernel os/stolaos.bin -serial stdio   # StolaOS
            ```

            ```cmd
            :: Windows (requiere clang en el PATH)
            s.exe run programa.stola
            s.exe build programa.stola -o programa.exe
            ```
          files: |
            artifacts/stolascript-linux-x86_64.tar.gz
            artifacts/stolascript-windows-x86_64.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
